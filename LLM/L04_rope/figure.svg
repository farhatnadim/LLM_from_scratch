<text x="772.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">p · θ_i</text>
<text x="720.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1c2833">q at position m, k at position n: q·k depends only on m − n</text>
