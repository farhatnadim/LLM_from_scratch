<text x="356.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#566573">second half x2</text>
<path d="M63 108 C63 128 279 128 279 108" stroke="#566573" fill="none" stroke-width="1.2"/>
<path d="M113 108 C113 140 329 140 329 108" stroke="#566573" fill="none" stroke-width="1.2"/>
