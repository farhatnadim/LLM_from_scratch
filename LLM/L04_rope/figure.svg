<path d="M213 108 C213 164 429 164 429 108" stroke="#566573" fill="none" stroke-width="1.2"/>
<text x="40.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#566573">pair i = (x_i, x_i+D/2): head_dim / 2 pairs (here head_dim = 8: 4 pairs)</text>
<text x="40.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1c2833">θ_i = base^(-2i / head_dim);  angle of pair i at position p = p · θ_i</text>
<text x="40.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#566573">pair 0 turns fastest, the last pair turns slowest</text>
<text x="40.0" y="262.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1c2833">rotate_half([x1 | x2]) = [-x2 | x1]</text>
<text x="40.0" y="286.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1c2833">rope(x) = x · cos + rotate_half(x) · sin</text>
<text x="40.0" y="310.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1c2833">cos, sin: tables [max_len, head_dim], made one time (rope_tables)</text>
